<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Bearing Analyzer</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-6xl bg-white shadow-xl rounded-3xl p-10 grid grid-cols-1 md:grid-cols-2 gap-10">
    
    <!-- Input Panel -->
    <div>
      <h1 class="text-3xl font-semibold text-gray-700 mb-6 border-b pb-2">AI Bearing Analyzer</h1>

      <label class="block text-sm text-gray-600 mb-2">Load (N)</label>
      <input id="load" type="number" class="w-full mb-6 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-400 outline-none" placeholder="Enter Load">

      <label class="block text-sm text-gray-600 mb-2">Vibrations (mm/s)</label>
      <div id="vibrationInputs" class="space-y-3 mb-8">
        <input type="number" class="input-field" placeholder="Bearing 1">
        <input type="number" class="input-field" placeholder="Bearing 2">
        <input type="number" class="input-field" placeholder="Bearing 3">
        <input type="number" class="input-field" placeholder="Bearing 4">
        <input type="number" class="input-field" placeholder="Bearing 5">
      </div>

      <button id="analyzeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-all">Analyze Bearings</button>
    </div>

    <!-- Results Panel -->
    <div>
      <h2 class="text-2xl font-semibold text-gray-700 mb-4 border-b pb-2">Predicted Output</h2>

      <div id="results" class="space-y-4 overflow-y-auto max-h-[40vh]">
        <p class="text-sm text-gray-500">Enter values and click "Analyze Bearings" to view predictions.</p>
      </div>

      <!-- Temperature Chart -->
      <div class="chart-box mt-6">
        <h3 class="text-lg font-semibold mb-2">Temperature Chart</h3>
        <canvas id="tempChart"></canvas>
      </div>

      <!-- Vibration Chart -->
      <div class="chart-box mt-6">
        <h3 class="text-lg font-semibold mb-2">Vibration Chart</h3>
        <canvas id="vibChart"></canvas>
      </div>

      <!-- Status Chart -->
      <div class="chart-box mt-6">
        <h3 class="text-lg font-semibold mb-2">Status Chart</h3>
        <canvas id="statusChart"></canvas>
      </div>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
